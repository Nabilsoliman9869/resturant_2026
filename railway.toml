# Railpack يشغّل npm ci و npm run build تلقائياً — لا تكرار npm ci هنا (يسبب EBUSY على node_modules/.vite)
# Python + pip: railpack.json
# Docs: https://docs.railway.com/guides/config-as-code

[deploy]
startCommand = "cd backend && python api_server.py"
healthcheckPath = "/api/ping"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
