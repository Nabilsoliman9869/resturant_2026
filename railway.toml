# إعدادات Railway — تُقرأ تلقائياً من الجذر (لا حاجة لأزرار «تفعيل» في لوحة التحكم)
# Docs: https://docs.railway.com/guides/config-as-code

[build]
buildCommand = "npm ci && npm run build && pip install -r backend/requirements.txt"

[deploy]
startCommand = "cd backend && python api_server.py"
healthcheckPath = "/api/ping"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
