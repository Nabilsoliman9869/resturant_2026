name: Build Mat3amPOS EXE

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'رقم الإصدار (مثال: 26)'
        required: true
        default: '26'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python deps
        run: |
          python -m pip install pyinstaller pillow pyodbc

      - name: npm build
        run: npm ci && npm run build

      - name: Prepare build
        run: python scripts/prepare_mat3am_exe_build.py

      - name: Build EXE
        run: python -m PyInstaller Mat3amPOS.spec --clean --noconfirm

      - name: Version artifact
        run: python scripts/version_exe_artifact.py ${{ github.event.inputs.version }}

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Mat3amPOS-${{ github.event.inputs.version }}
          path: dist/Mat3amPOS*.exe
