<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>التحويل إلى تسجيل الدخول</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #111827; color: #e5e7eb; }
    .card { width: min(92vw, 420px); padding: 24px; border-radius: 16px; background: #1f2937; box-shadow: 0 10px 30px rgba(0,0,0,.28); text-align: center; }
    a { color: #93c5fd; }
  </style>
</head>
<body>
  <div class="card">
    <h1 style="margin-top: 0;">يتم تحويلك إلى شاشة الدخول الموحدة</h1>
    <p>هذه الصفحة القديمة لم تعد معتمدة للتشغيل. استخدم تطبيق المطعم الرئيسي حتى تبقى الجلسات والصلاحيات متسقة.</p>
    <p><a id="go" href="/static/restaurant/login">الانتقال الآن إلى شاشة الدخول</a></p>
  </div>
  <script>
    const isViteDev = window.location.port === "9999" || window.location.port === "5290";
    const target = isViteDev ? "/login" : "/static/restaurant/login";
    const link = document.getElementById("go");
    if (link) link.setAttribute("href", target);
    window.location.replace(target);
  </script>
</body>
</html>
