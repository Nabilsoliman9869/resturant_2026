<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>دخول — Smart CashFlow</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #1a1d29; color: #e4e6eb; }
    .card { background: #252836; border-radius: 16px; padding: 2rem; width: 100%; max-width: 360px; box-shadow: 0 8px 32px rgba(0,0,0,.4); }
    h1 { margin: 0 0 .5rem; font-size: 1.25rem; }
    .sub { color: #888; font-size: 0.9rem; margin-bottom: 1.5rem; }
    label { display: block; margin-bottom: 0.35rem; font-size: 0.9rem; }
    input { width: 100%; padding: 0.6rem 0.75rem; border: 1px solid #3d4152; border-radius: 8px; background: #1a1d29; color: #e4e6eb; font-size: 1rem; margin-bottom: 1rem; }
    input:focus { outline: none; border-color: #6c5ce7; }
    .btn { width: 100%; padding: 0.75rem; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; background: #6c5ce7; color: #fff; margin-top: 0.5rem; }
    .btn:hover { background: #5b4cdb; }
    .err { color: #ff6b6b; font-size: 0.9rem; margin-top: 0.5rem; min-height: 1.2em; }
    .link { margin-top: 1rem; text-align: center; }
    .link a { color: #6c5ce7; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>دخول المحاسب</h1>
    <p class="sub">اسم المستخدم وكلمة المرور (أو DEV / 123 للتطوير)</p>
    <form id="f">
      <label>اسم المستخدم</label>
      <input type="text" id="username" name="username" placeholder="مثال: ISLAM أو DEV" autocomplete="username" required>
      <label>كلمة المرور</label>
      <input type="password" id="password" name="password" placeholder="كلمة المرور" autocomplete="current-password" required>
      <button type="submit" class="btn">دخول</button>
      <div class="err" id="err"></div>
    </form>
    <div class="link"><a href="/">العودة للرئيسية</a></div>
  </div>
  <script>
    const API = window.location.origin;
    const errEl = document.getElementById("err");
    document.getElementById("f").onsubmit = async (e) => {
      e.preventDefault();
      errEl.textContent = "";
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      try {
        const r = await fetch(API + "/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });
        const data = await r.json().catch(() => ({}));
        if (r.ok && data.ok) {
          localStorage.setItem("voucher_user", data.user || username);
          localStorage.setItem("voucher_role", data.role || "user");
          window.location.href = "/";
          return;
        }
        var msg = data.detail || "";
        if (r.status === 404 || msg === "Not Found" || msg === "not found") {
          msg = "خدمة تسجيل الدخول غير متاحة. تأكد من تشغيل التطبيق وإعادة تحميل الصفحة.";
        }
        if (!msg) msg = "فشل الدخول. تحقق من اسم المستخدم وكلمة المرور.";
        errEl.textContent = msg;
      } catch (e) {
        errEl.textContent = "تعذر الاتصال بالخادم. تحقق من تشغيل التطبيق ثم أعد المحاولة.";
      }
    };
  </script>
</body>
</html>
