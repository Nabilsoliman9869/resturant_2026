  <script>
(function () {
  var API_BASE = (new URLSearchParams(window.location.search)).get('api_base')
    || (window.parent !== window && window.parent.document.getElementById('apiBase') && window.parent.document.getElementById('apiBase').value)
    || localStorage.getItem('xtra_web_api_base')
    || 'http://127.0.0.1:2288';

  function status(t, ok) {
    var el = document.getElementById('statusLine');
    el.textContent = t;
    el.style.color = ok ? '#064' : '#a00';
  }

  function val(id) {
    var e = document.getElementById(id);
    return e ? e.value : '';
  }

  function setv(id, x) {
    var e = document.getElementById(id);
    if (e) e.value = x != null && x !== undefined ? String(x) : '';
  }

  function numStr(v) {
    if (v == null || v === '') return '';
    var n = parseFloat(v);
    return isNaN(n) ? '' : String(n);
  }

  function collectPayload() {
    var p = {
      TxItemName: val('TxItemName'),
      TxCode: val('TxCode'),
      TxLatinName: val('TxLatinName'),
      TxStatementName: val('TxStatementName'),
      GroupGuid: val('selGroup') || null,
      DefaultCurrency: val('selCurrency') || null,
      AccountGuide: val('selAccount') || null,
      RelatedAgent: val('selRelatedAgent') || null,
      CmbItemType: val('CmbItemType'),
      NmbTax: val('NmbTax'),
      enterNumberData15: val('enterNumberData15'),
      enterNumberData16: val('enterNumberData16'),
      EDDefaultExpiryDate: val('EDDefaultExpiryDate'),
      enterTextData4: val('enterTextData4'),
      enterTextData5: val('enterTextData5'),
      enterTextData9: val('enterTextData9'),
      enterTextData10: val('enterTextData10'),
      enterTextData11: val('enterTextData11'),
      enterTextData12: val('enterTextData12'),
      enterTextData13: val('enterTextData13'),
      AgentPrice: val('NmbAgentPrice'),
      EndUserPrice: val('NmbEndUserPrice'),
      NmbPrepMinutes: val('NmbPrepMinutes'),
      Hieght3: val('NmbPrepMinutes'),
    };
    return p;
  }

  function clearForm() {
    document.getElementById('currentCardGuide').value = '';
    ['TxItemName','TxCode','TxLatinName','TxStatementName','NmbTax','NmbAgentPrice','NmbEndUserPrice','NmbPrepMinutes',
     'enterNumberData15','enterNumberData16','EDDefaultExpiryDate','enterTextData4','enterTextData5',
     'enterTextData9','enterTextData10','enterTextData11','enterTextData12','enterTextData13'].forEach(function (id) { setv(id, ''); });
    document.getElementById('selGroup').value = '';
    document.getElementById('selCurrency').value = '';
    document.getElementById('selAccount').value = '';
    document.getElementById('selRelatedAgent').value = '';
    document.getElementById('CmbItemType').selectedIndex = 1;
    for (var i = 1; i <= 5; i++) setv('SrhItemCardCategory' + i, '');
  }

  function applyServerCard(data) {
    var v = data.values || {};
    var d = data.display || {};
    document.getElementById('currentCardGuide').value = v.CardGuide || '';
    setv('TxItemName', v.ProductName);
    setv('TxCode', v.CardCode);
    setv('TxLatinName', v.LatinName);
    var stmtCol = v.StatementName != null ? v.StatementName : v.BillStatementName;
    setv('TxStatementName', stmtCol != null ? stmtCol : '');
    setv('NmbTax', numStr(v.TaxRatio != null ? v.TaxRatio : (v.TaxPercent != null ? v.TaxPercent : v.Tax)));
    setv('NmbAgentPrice', numStr(v.AgentPrice));
    setv('NmbEndUserPrice', numStr(v.EndUserPrice));
    setv('NmbPrepMinutes', numStr(v.Hieght3 != null ? v.Hieght3 : v.PrepMinutes));
    setv('enterNumberData15', numStr(v.MinimumQuantity != null ? v.MinimumQuantity : v.MinLimit));
    setv('enterNumberData16', numStr(v.MaximumQuantity != null ? v.MaximumQuantity : v.MaxLimit));
    setv('EDDefaultExpiryDate', v.DefaultExpiryDate || v.ExpiryDate || '');
    setv('enterTextData4', v.Specifications || v.Description || v.ProductSpecs || '');
    setv('enterTextData5', v.SourceText || v.ProductSource || '');
    setv('enterTextData9', v.CustomText1 || v.Text01 || v.EnterTextData9 || '');
    setv('enterTextData10', v.CustomText2 || v.Text02 || '');
    setv('enterTextData11', v.CustomText3 || v.Text03 || '');
    setv('enterTextData12', v.CustomText4 || v.Text04 || '');
    setv('enterTextData13', v.CustomText5 || v.Text05 || '');

    var it = v.ItemType != null ? v.ItemType : v.ProductType;
    var isSvc = v.IsService === 1 || v.IsService === true || it === 1;
    document.getElementById('CmbItemType').value = isSvc ? 'مادة خدمية' : 'مادة مستودعية';

    if (data.guides && data.guides.GroupGuid)
      document.getElementById('selGroup').value = data.guides.GroupGuid;
    else
      document.getElementById('selGroup').value = v.GroupGuid || '';

    if (data.guides && data.guides.DefaultCurrency)
      document.getElementById('selCurrency').value = data.guides.DefaultCurrency;
    else
      document.getElementById('selCurrency').value = v.DefaultCurrency || '';

    if (data.guides && data.guides.AccountGuide)
      document.getElementById('selAccount').value = data.guides.AccountGuide;
    else
      document.getElementById('selAccount').value = '';

    if (data.guides && data.guides.RelatedAgent)
      document.getElementById('selRelatedAgent').value = data.guides.RelatedAgent;
    else
      document.getElementById('selRelatedAgent').value = '';

    setv('SrhItemCardCategory1', d.SrhItemCardCategory1 || '');
    setv('SrhItemCardCategory2', d.SrhItemCardCategory2 || '');
    setv('SrhItemCardCategory3', d.SrhItemCardCategory3 || '');
    setv('SrhItemCardCategory4', d.SrhItemCardCategory4 || '');
    setv('SrhItemCardCategory5', d.SrhItemCardCategory5 || '');
  }

  function loadProductList() {
    fetch(API_BASE + '/api/products')
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var sel = document.getElementById('selProductList');
        sel.innerHTML = '<option value="">— اختر للتحميل —</option>';
        (d.products || []).forEach(function (p) {
          var o = document.createElement('option');
          o.value = p.CardGuide;
          o.textContent = (p.ProductName || '—') + (p.Price != null ? ' (' + p.Price + ')' : '');
          sel.appendChild(o);
        });
      })
      .catch(function () { status('تعذر تحميل قائمة المواد', false); });
  }

  function fillSelect(url, selId, mapFn) {
    fetch(API_BASE + url)
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var sel = document.getElementById(selId);
        var keep = sel.options[0];
        sel.innerHTML = '';
        sel.appendChild(keep);
        mapFn(d, sel);
      })
      .catch(function () {});
  }

  function initLookups() {
    fillSelect('/api/product-groups', 'selGroup', function (d, sel) {
      (d.groups || []).forEach(function (g) {
        var o = document.createElement('option');
        o.value = g.CardGuide;
        o.textContent = g.GroupName || g.CardGuide;
        sel.appendChild(o);
      });
    });
    fillSelect('/api/currencies', 'selCurrency', function (d, sel) {
      (d.currencies || []).forEach(function (c) {
        var o = document.createElement('option');
        o.value = c.CardGuide;
        o.textContent = (c.CurrencyName || c.LatinName || '') + '';
        sel.appendChild(o);
      });
    });
    fillSelect('/api/accounts/sub?leaves_only=true&active_only=true', 'selAccount', function (d, sel) {
      (d.accounts || []).slice(0, 400).forEach(function (a) {
        var o = document.createElement('option');
        o.value = a.CardGuide;
        var code = a.CardCode != null ? String(a.CardCode) : '';
        o.textContent = (code ? code + ' — ' : '') + (a.AccountName || a.CardGuide);
        sel.appendChild(o);
      });
    });
    fillSelect('/api/agents', 'selRelatedAgent', function (d, sel) {
      (d.agents || []).slice(0, 300).forEach(function (a) {
        var o = document.createElement('option');
        o.value = a.CardGuide;
        o.textContent = (a.AgentName || a.CardGuide);
        sel.appendChild(o);
      });
    });
  }

  document.getElementById('btnLoad').onclick = function () {
    var g = document.getElementById('selProductList').value;
    if (!g) { status('اختر مادة من القائمة', false); return; }
    status('جاري التحميل...', true);
    fetch(API_BASE + '/api/products/' + encodeURIComponent(g) + '/xtra')
      .then(function (r) {
        if (!r.ok) return r.json().then(function (x) { throw new Error(x.detail || r.status); });
        return r.json();
      })
      .then(function (data) {
        applyServerCard(data);
        status('تم التحميل', true);
      })
      .catch(function (e) { status('خطأ: ' + e.message, false); });
  };

  document.getElementById('btnNew').onclick = function () {
    clearForm();
    document.getElementById('selProductList').value = '';
    status('بطاقة جديدة', true);
  };

  document.getElementById('btnSave').onclick = function () {
    var name = val('TxItemName').trim();
    if (!name) { status('اسم المادة مطلوب', false); return; }
    var cg = document.getElementById('currentCardGuide').value.trim();
    var payload = collectPayload();
    var url = cg
      ? (API_BASE + '/api/products/' + encodeURIComponent(cg) + '/xtra')
      : (API_BASE + '/api/products/xtra');
    var method = cg ? 'PUT' : 'POST';
    status('جاري الحفظ...', true);
    fetch(url, {
      method: method,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    })
      .then(function (r) {
        if (!r.ok) return r.json().then(function (x) { throw new Error(x.detail || JSON.stringify(x)); });
        return r.json();
      })
      .then(function (res) {
        if (!cg && res.CardGuide) {
          document.getElementById('currentCardGuide').value = res.CardGuide;
          loadProductList();
        }
        status('تم الحفظ — ' + (res.columns_written ? res.columns_written.length + ' حقل' : ''), true);
      })
      .catch(function (e) { status('خطأ: ' + e.message, false); });
  };

  document.getElementById('btnSearch').onclick = function () {
    var q = document.getElementById('quickSearch').value.trim();
    if (!q) { loadProductList(); return; }
    fetch(API_BASE + '/api/products/search?search_text=' + encodeURIComponent(q))
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var sel = document.getElementById('selProductList');
        sel.innerHTML = '<option value="">— نتائج البحث —</option>';
        (d.products || []).forEach(function (p) {
          var o = document.createElement('option');
          o.value = p.CardGuide;
          o.textContent = p.ProductName || '—';
          sel.appendChild(o);
        });
        status('نتائج: ' + (d.products || []).length, true);
      })
      .catch(function (e) { status('خطأ بحث: ' + e.message, false); });
  };

  initLookups();
  loadProductList();
  status('جاهز — API: ' + API_BASE, true);
})();
  </script>
</body>
</html>
